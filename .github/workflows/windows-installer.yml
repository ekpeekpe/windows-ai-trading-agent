name: Windows NSIS installer candidate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python package and packaging tools
        run: python -m pip install -e "./backend[windows,dev,package]" pillow
      - name: Run portable backend tests (no real terminal)
        working-directory: backend
        run: python -m pytest -q
      - name: Freeze authenticated Python backend with MT5 runtime
        working-directory: backend
        run: >-
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name agent-backend --paths .
          --collect-all keyring --collect-all MetaTrader5
          --collect-submodules openai --collect-submodules anthropic
          --collect-submodules google.genai
          --exclude-module google.genai.tests --exclude-module pytest
          --hidden-import app.main --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto
          launcher.py
      - name: Smoke-test frozen Windows Python backend over authenticated HTTP
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $env:AGENT_PORT = [string]$port
          $env:AGENT_DIAGNOSTIC = '1'
          $env:AGENT_LOCAL_TOKEN = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $exe = (Resolve-Path 'backend/dist/agent-backend.exe').Path
          $child = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          $lastProbe = 'No HTTP attempt yet'
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($child.HasExited) { throw ('Frozen backend exited unexpectedly: ' + $child.ExitCode) }
              Start-Sleep -Milliseconds 500
              try {
                $url = 'http://127.0.0.1:' + $port + '/providers'
                $response = Invoke-RestMethod -Uri $url -TimeoutSec 2 -Headers @{'x-agent-token' = $env:AGENT_LOCAL_TOKEN}
                if ($response.providers.Count -ge 3) { $ready = $true; break }
              } catch { $lastProbe = $_.Exception.GetType().Name }
            }
            if (-not $ready) {
              Write-Host ('Last local probe error type: ' + $lastProbe)
              Get-ChildItem "$env:TEMP/windows_ai_agent_*.startup.log" -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host 'Frozen backend startup events:'
                Get-Content $_.FullName
              }
              throw 'Frozen backend failed authenticated readiness; see sanitized diagnostics above'
            }
            Write-Host 'PASS: PyInstaller backend starts, responds to authenticated request and remains read-only'
          } finally {
            if (-not $child.HasExited) { Stop-Process -Id $child.Id -Force }
            Remove-Item Env:AGENT_PORT,Env:AGENT_LOCAL_TOKEN,Env:AGENT_DIAGNOSTIC -ErrorAction SilentlyContinue
          }
      - name: Stage platform-qualified sidecar and placeholder app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries,desktop/src-tauri/icons | Out-Null
          Copy-Item backend/dist/agent-backend.exe desktop/src-tauri/binaries/agent-backend-x86_64-pc-windows-msvc.exe
          python desktop/scripts/generate_icon.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: React type-check and production build
        working-directory: desktop
        run: npm run build
      - name: Build native Tauri 2 NSIS installer
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis
      - name: Record artifact digests
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ai-trading-agent-nsis-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  report:
    if: always()
    needs: [package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Save real installer build result to separate report branch
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const run_id = context.runId;
            const response = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id, per_page: 100});
            const jobs = response.data.jobs.map(j => ({
              name: j.name, status: j.status, conclusion: j.conclusion, url: j.html_url,
              failed_steps: (j.steps || []).filter(s => s.conclusion === 'failure').map(s => s.name)
            }));
            const report = {
              run_id, sha: context.sha,
              url: `https://github.com/${owner}/${repo}/actions/runs/${run_id}`,
              installer_result: '${{ needs.package-windows.result }}',
              jobs, generated_at: new Date().toISOString()
            };
            const encoded = Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64');
            for (const path of [`runs/${run_id}.json`, 'latest.json']) {
              let sha;
              try {
                const old = await github.rest.repos.getContent({owner, repo, path, ref: 'installer-build-reports'});
                sha = old.data.sha;
              } catch (e) { if (e.status !== 404) throw e; }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch: 'installer-build-reports',
                message: `CI: Windows installer run ${run_id}`, content: encoded, ...(sha ? {sha} : {})
              });
            }
