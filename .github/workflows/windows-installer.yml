name: Windows NSIS installer candidate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python package and packaging tools
        run: python -m pip install -e "./backend[windows,dev,package]" pillow
      - name: Run portable backend tests (no real terminal)
        working-directory: backend
        run: python -m pytest -q
      - name: Freeze authenticated Python backend with MT5 runtime
        working-directory: backend
        run: >-
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name agent-backend --paths .
          --collect-all keyring --collect-all MetaTrader5
          --collect-submodules openai --collect-submodules anthropic
          --collect-submodules google.genai
          --hidden-import app.main --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto
          launcher.py
      - name: Stage platform-qualified sidecar and placeholder app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries,desktop/src-tauri/icons | Out-Null
          Copy-Item backend/dist/agent-backend.exe desktop/src-tauri/binaries/agent-backend-x86_64-pc-windows-msvc.exe
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          p=Path('desktop/src-tauri/icons'); p.mkdir(exist_ok=True)
          i=Image.new('RGBA',(256,256),(22,31,48,255)); d=ImageDraw.Draw(i)
          d.line([(24,173),(68,121),(117,147),(166,76),(231,53)],fill=(82,214,174,255),width=12)
          i.save(p/'icon.png'); i.save(p/'icon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | python -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: React type-check and production build
        working-directory: desktop
        run: npm run build
      - name: Build native Tauri 2 NSIS installer
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis
      - name: Record artifact digests
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ai-trading-agent-nsis-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
