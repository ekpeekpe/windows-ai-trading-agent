name: Portable tests and frontend build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python backend and development dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Compile Python source
        run: python -m compileall -q backend/app
      - name: Portable unit tests (real terminal tests skip)
        working-directory: backend
        run: python -m pytest -q

  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python backend and development dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Portable Windows tests (interactive MT5 tests skip)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Type-check and build React frontend
        working-directory: desktop
        run: npm run build
  frontend-build:
    name: React TypeScript production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and build
        run: npm run build
