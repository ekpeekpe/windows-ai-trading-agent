name: Portable tests and frontend build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python backend and development dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Compile Python source
        run: python -m compileall -q backend/app
      - name: Portable unit tests (real terminal tests skip)
        working-directory: backend
        run: python -m pytest -q

  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python backend and development dependencies
        run: python -m pip install -e "./backend[windows,dev]"
      - name: Portable Windows tests (interactive MT5 tests skip)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Type-check and build React frontend
        working-directory: desktop
        run: npm run build
      - name: Install browser runtime for UI acceptance
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Render and test menus, dialogs and chat (mocked backend)
        working-directory: desktop
        run: npm run test:e2e
      - name: Upload actual browser screenshots and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-ui-browser-evidence
          path: |
            desktop/test-results/*.png
            desktop/test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 7
